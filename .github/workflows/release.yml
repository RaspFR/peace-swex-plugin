name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install build tooling
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./swpl/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match swpl/package.json version $PKG" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/swpl.asar
            dist/swpl.yml
          fail_on_unmatched_files: true
