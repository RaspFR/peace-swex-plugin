name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run smoke-test

      - run: npm run build

      - name: Confirm dist files exist
        run: |
          test -f dist/swpl.asar
          test -f dist/swpl.yml
